<!doctype html>
<html lang="it" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap-css/bootstrap.rtl.min.css}">
    <title>Home Page - Gestione Dipendenti</title>
</head>
<body>

<div class="container mt-4">

    <!-- Intestazione -->
    <h1 class="mb-4">🏢 Gestione Dipendenti</h1>

    <!-- Messaggio di successo dopo registrazione o modifica -->
    <div th:if="${pNew != null}">
        <div class="alert alert-success" role="alert">
            <h4 class="alert-heading">✅ Operazione completata!</h4>
            <p>
                <strong th:text="${msg}"></strong>
                <span th:text="${pNew.nome + ' ' + pNew.cognome}"></span>
                <span th:if="${pNew.tipoRuolo != null}" th:text="' (' + ${pNew.tipoRuolo} + ')'"></span>
            </p>
            <hr>
            <p class="mb-0">
                <small>
                    📧 <span th:text="${pNew.email}"></span> &nbsp;|&nbsp; 
                    💰 <span th:text="${#numbers.formatDecimal(pNew.stipendio, 1, 2)}"></span> €
                </small>
            </p>
        </div>
    </div>

    <!-- Messaggio di errore generico (se presente) -->
    <div th:if="${msg != null and pNew == null}" class="alert alert-warning" role="alert" th:text="${msg}"></div>

    <!-- Pulsanti azioni -->
    <div class="mt-4">
        <a class="btn btn-success btn-lg" th:href="@{/new}">➕ Nuovo Dipendente</a>
        <a class="btn btn-primary btn-lg" th:href="@{/gestione}">📋 Gestisci</a>
    </div>

</div>

<script th:src="@{/js/bootstrap-js/bootstrap.bundle.min.js}"></script>
</body>
</html>
