<!doctype html>
<html lang="it" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap-css/bootstrap.rtl.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Gestione Utenti</title>
</head>
<body>
<div class="container animate-fade">
    <h2>👥 Gestione Utenti</h2>

    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>

    <a class="btn btn-success mb-3" th:href="@{/users/new}">➕ Nuovo Utente</a>
    <a class="btn btn-secondary mb-3" th:href="@{/home}">← Torna alla Home</a>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Ruolo</th>
                <th>Azioni</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.username}"></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.permission.type}"></td>
                <td>
                    <a class="btn btn-danger btn-sm" th:href="@{/users/delete(id=${u.id})}"
                       onclick="return confirm('Sei sicuro di voler eliminare questo utente?')">ELIMINA</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
<script th:src="@{/js/bootstrap-js/bootstrap.bundle.min.js}"></script>
</body>
</html>
