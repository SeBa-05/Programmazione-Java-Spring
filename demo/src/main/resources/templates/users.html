<!doctype html>
<html lang="it" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap-css/bootstrap.rtl.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Gestione Utenti</title>
</head>
<body>
<div class="container animate-fade">

    <h2>👥 Gestione Utenti</h2>

    <div th:if="${msg}" class="alert alert-success" role="alert" th:text="${msg}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <div class="mb-3 d-flex flex-wrap gap-2">
        <a class="btn btn-success" th:href="@{/users/new}" th:if="${isAdmin}">➕ Nuovo Utente</a>
        <a class="btn btn-secondary" th:href="@{/home}">← Torna alla Home</a>
    </div>

    <!-- ======== WRAPPER PER SCROLL ORIZZONTALE ======== -->
    <div class="table-wrapper">
        <table class="table table-striped table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Ruolo</th>
                    <th class="text-center">Azioni</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${users}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.email}"></td>
                    <td>
                        <span class="badge" th:class="${u.permission.type == 'ADMIN' ? 'bg-danger' : 'bg-info'}" 
                              th:text="${u.permission.type}"></span>
                    </td>
                    <td class="text-center">
                        <a class="btn btn-danger btn-sm" th:href="@{/users/delete(id=${u.id})}"
                           onclick="return confirm('Sei sicuro di voler eliminare questo utente?')">🗑️ Elimina</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <!-- =============================================== -->

</div>
<script th:src="@{/js/bootstrap-js/bootstrap.bundle.min.js}"></script>
</body>
</html>
