<!doctype html>
<html lang="it" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap-css/bootstrap.rtl.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Gestione Dipendenti</title>
</head>
<body>
<div class="container animate-fade">

    <h2 class="mb-3">📋 Elenco Dipendenti</h2>

    <div th:if="${msg != null}" class="alert alert-info" role="alert" th:text="${msg}"></div>

    <table class="table table-striped table-bordered table-hover" id="tabella-dipendenti">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Cognome</th>
                <th>Codice Fiscale</th>
                <th>Data Nascita</th>
                <th>Stipendio</th>
                <th>Email</th>
                <th>Data Assunzione</th>
                <th>Ruolo</th>
                <th th:if="${isAdmin}">Azioni</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="d : ${items}">
                <td th:text="${d.id}"></td>
                <td th:text="${d.nome}"></td>
                <td th:text="${d.cognome}"></td>
                <td th:text="${d.cf}"></td>
                <td th:text="${#temporals.format(d.dataDiNascita, 'dd/MM/yyyy')}"></td>
                <td th:text="${#numbers.formatDecimal(d.stipendio, 1, 2)}"></td>
                <td th:text="${d.email}"></td>
                <td th:text="${#temporals.format(d.dataDiAssunzione, 'dd/MM/yyyy')}"></td>
                <td>
                    <span class="badge-role"
                          th:classappend="${d.tipoRuolo != null ? d.tipoRuolo.name().toLowerCase().replace('_', '-') : 'programmatore'}"
                          th:text="${d.tipoRuolo}"></span>
                </td>
                <td th:if="${isAdmin}">
                    <a class="btn btn-primary btn-sm" th:href="@{'/' + ${d.id} + '/edit'}">MODIFICA</a>
                    <a class="btn btn-danger btn-sm" th:href="@{/delete(id=${d.id})}"
                       onclick="return confirm('Sei sicuro?')">ELIMINA</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Paginazione -->
    <nav aria-label="Paginazione dipendenti" th:if="${totalPages > 0}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? disabled">
                <a class="page-link" th:href="@{/gestione(page=${currentPage - 1})}"
                   th:if="${currentPage > 0}">Precedente</a>
                <span class="page-link" th:unless="${currentPage > 0}">Precedente</span>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                <a class="page-link" th:href="@{/gestione(page=${i})}"
                   th:classappend="${i == currentPage} ? active"
                   th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? disabled">
                <a class="page-link" th:href="@{/gestione(page=${currentPage + 1})}"
                   th:if="${currentPage < totalPages - 1}">Successiva</a>
                <span class="page-link" th:unless="${currentPage < totalPages - 1}">Successiva</span>
            </li>
        </ul>
    </nav>

    <div class="mt-3">
        <a class="btn btn-secondary" th:href="@{/home}">← Torna alla Home</a>
        <a class="btn btn-success" th:href="@{/new}" th:if="${isAdmin}">➕ Nuovo Dipendente</a>
    </div>

</div>
<script th:src="@{/js/bootstrap-js/bootstrap.bundle.min.js}"></script>
</body>
</html>
