<!doctype html>
<html lang="it" xmlns:th="https://www.thymeleaf.org">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap-css/bootstrap.rtl.min.css}">
	<title>Home page Spring </title>
    
  </head>
  <body>
  
  <div th:if="${msg != null}" class="alert alert-info" role="alert" th:text="${msg}"></div>
  
  <table class="table table-striped table-bordered">
  <thead>
    <tr>
      <th scope="col">Id</th>
      <th scope="col">Nome</th>
      <th scope="col">Cognome</th>
      <th scope="col">Codice Fiscale</th>
      <th scope="col">Azioni</th>
    </tr>
  </thead>
  
  <tbody>
    <tr th:each="p: ${items}">
      <td th:text="${p.id}"></td>
      <td th:text="${p.nome}"></td>
      <td th:text="${p.cognome}"></td>
      <td th:text="${p.cf}"></td>
      <td>
      	<a class="btn btn-primary" th:href="@{/edit/{id}(id=${p.id})}">MODIFICA</a>
		<a class="btn btn-primary" th:href="@{/delete/{id}(id=${p.id})}" onclick="return confirm('Sei sicuro?')">ELIMINA</a>
      </td>
    </tr>
  </tbody>
</table>
  
  <a class="btn btn-primary" href="/"> HOME</a>

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script th:src="@{/js/bootstrap-js/bootstrap.bundle.min.js}"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    -->
  </body>
</html>
