<!doctype html>
<html lang="it" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap-css/bootstrap.rtl.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Gestione Dipendenti</title>
</head>
<body>

<div class="container animate-fade">

    <h2 class="mb-3"> Elenco Dipendenti</h2>

    <!-- Messaggio di feedback -->
    <div th:if="${msg != null}" class="alert alert-info" role="alert" th:text="${msg}"></div>

    <!-- ============ BOTTONI DI FILTRO ============ -->
    <div class="btn-group mb-3" role="group">
	    <button class="btn btn-outline-primary" data-filtro="nomecognome">👤 Nome e Cognome</button>
	    <button class="btn btn-outline-primary" data-filtro="cf">🆔 Codice Fiscale</button>
	    <button class="btn btn-outline-primary" data-filtro="ruolo">💼 Ruolo</button>
	    <button class="btn btn-outline-primary" data-filtro="stipendio">💰 Stipendio</button>
	    <button class="btn btn-secondary" data-filtro="reset">🔄 Reset</button>
	</div>

    <!-- ============ BARRE DI RICERCA ============ -->
	<div id="filtro-nomecognome" class="filtro-container" style="display:none;">
	    <div class="row g-2 mb-3">
	        <div class="col-md-6">
	            <div class="input-group">
	                <span class="input-group-text">👤</span>
	                <input type="text" class="form-control" 
	                       id="filtro-nome-input" 
	                       placeholder="Inserisci Nome" 
	                       data-colonna="1">
	            </div>
	        </div>
	        <div class="col-md-6">
	            <div class="input-group">
	                <span class="input-group-text">👤</span>
	                <input type="text" class="form-control" 
	                       id="filtro-cognome-input" 
	                       placeholder="Inserisci Cognome" 
	                       data-colonna="2">
	            </div>
	        </div>
	        <div class="col-12 mt-2">
	            <small class="text-muted">🔍 Filtra per Nome E Cognome contemporaneamente</small>
	        </div>
	    </div>
	</div>
	
	<div id="filtro-cf" class="filtro-container" style="display:none;">
	    <div class="input-group mb-3">
	        <span class="input-group-text">🔍</span>
	        <input type="text" class="form-control" placeholder="Cerca per CODICE FISCALE..." data-colonna="3">
	    </div>
	</div>
	
	<div id="filtro-ruolo" class="filtro-container" style="display:none;">
	    <div class="input-group mb-3">
	        <span class="input-group-text">🔍</span>
	        <select class="form-select" data-colonna="8">
	            <option value="">Tutti i ruoli</option>
	            <option th:each="r : ${T(com.example.demo.entities.Ruolo).values()}" 
	                    th:value="${r}" th:text="${r}"></option>
	        </select>
	    </div>
	</div>
	
	<div id="filtro-stipendio" class="filtro-container" style="display:none;">
	    <div class="row g-2 mb-3">
	        <div class="col-md-5">
	            <div class="input-group">
	                <span class="input-group-text">Da</span>
	                <input type="number" step="100" class="form-control" placeholder="Min" data-colonna="5" data-tipo="min">
	            </div>
	        </div>
	        <div class="col-md-5">
	            <div class="input-group">
	                <span class="input-group-text">A</span>
	                <input type="number" step="100" class="form-control" placeholder="Max" data-colonna="5" data-tipo="max">
	            </div>
	        </div>
	        <div class="col-md-2">
	            <button class="btn btn-primary w-100" id="btn-filtra-stipendio">Applica</button>
	        </div>
	    </div>
	</div>

    <!-- ============ TABELLA ============ -->
    <table class="table table-striped table-bordered table-hover" id="tabella-dipendenti">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Cognome</th>
                <th>Codice Fiscale</th>
                <th>Data Nascita</th>
                <th>Stipendio</th>
                <th>Email</th>
                <th>Data Assunzione</th>
                <th>Ruolo</th>
                <th>Azioni</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="d : ${items}">
                <td th:text="${d.id}"></td>
                <td th:text="${d.nome}"></td>
                <td th:text="${d.cognome}"></td>
                <td th:text="${d.cf}"></td>
                <td th:text="${#temporals.format(d.dataDiNascita, 'dd/MM/yyyy')}"></td>
                <td th:text="${#numbers.formatDecimal(d.stipendio, 1, 2)}"></td>
                <td th:text="${d.email}"></td>
                <td th:text="${#temporals.format(d.dataDiAssunzione, 'dd/MM/yyyy')}"></td>
                <td>
                    <span class="badge-role" 
					      th:class="${d.tipoRuolo != null ? 'badge-role ' + d.tipoRuolo.name().toLowerCase().replace('_', '-') : 'badge-role'}" 
					      th:text="${d.tipoRuolo != null ? d.tipoRuolo : 'Non definito'}">
					</span>
                </td>
                <td>
                    <a class="btn btn-primary btn-sm" th:href="@{/edit/{id}(id=${d.id})}">MODIFICA</a>
                    <a class="btn btn-danger btn-sm" th:href="@{/delete/{id}(id=${d.id})}" 
                       onclick="return confirm('Sei sicuro?')">ELIMINA</a>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Pulsante HOME -->
    <div class="mt-3">
        <a class="btn btn-secondary" th:href="@{/home}">← Torna alla Home</a>
    </div>

</div>

<!-- ============ JAVASCRIPT ============ -->
<script th:src="@{/js/bootstrap-js/bootstrap.bundle.min.js}"></script>
<!-- SCRIPT PERSONALIZZATO PER I FILTRI -->
<script th:src="@{/js/gestione.js}"></script>

</body>
</html>
