<!doctype html>
<html lang="it" xmlns:th="https://www.thymeleaf.org">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" th:href="@{/css/bootstrap-css/bootstrap.rtl.min.css}">
	<title>Home page Spring </title>
    
  </head>
  <body>
  
  
  
  <form th:action="${p.id} != null ? @{/edit/{id}(id=${p.id})} : @{/new}" class="row g-3" th:object="${p}" method="post">
  
  <div class="col-md-4">
    <label for="validationCustom01" class="form-label">Nome</label>
    <input type="text" class="form-control" th:field="*{nome}" id="validationCustom01" placeholder="Inserisci il nome" required>
    
  </div>
  
  <div class="col-md-4">
    <label for="validationCustom02" class="form-label">Cognome</label>
    <input type="text" class="form-control" th:field="*{cognome}" id="validationCustom02" placeholder="Inserisci il cognome" required>
    
  </div>
  
  <div class="col-md-4">
    <label for="validationCustomUsername" class="form-label">Codice Fiscale</label>
    <div class="input-group has-validation">
      
      <input type="text" class="form-control" th:field="*{cf}" placeholder="Inserisci il codice fiscale" id="validationCustomUsername" aria-describedby="inputGroupPrepend" required>
      
    </div>
  </div>
  
  	<div class="col-12">
    	<button class="btn btn-primary" type="reset">Cancella</button>
    	<button class="btn btn-success" type="submit" th:if="${p.id} == null or ${p.id} == 0">Registrati</button>
		<button class="btn btn-primary" type="submit" th:if="${p.id} != null and ${p.id} != 0">Applica</button>
    	<a class="btn btn-primary" href="/home">Annulla</a>
	</div>

</form>

  
 
  
  
  
  
  

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script th:src="@{/js/bootstrap-js/bootstrap.bundle.min.js}"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    -->
  </body>
</html>
