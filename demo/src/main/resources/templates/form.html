<!doctype html>
<html lang="it" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap-css/bootstrap.rtl.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Form Dipendente</title>
</head>
<body>

<div class="container container-form">

    <h2 th:if="${p.id == null or p.id == 0}">➕ Nuovo Dipendente</h2>
    <h2 th:if="${p.id != null and p.id != 0}">✏️ Modifica Dipendente</h2>

    <!-- Messaggio di avviso (es. nessuna modifica) -->
    <div th:if="${msg != null}" class="alert alert-warning" role="alert" th:text="${msg}"></div>

    <form th:action="${p.id} != null ? @{/edit/{id}(id=${p.id})} : @{/new}" 
          class="row g-3" th:object="${p}" method="post">

        <!-- Campi Persona -->
        <div class="col-md-6">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control" th:field="*{nome}" id="nome"
                   placeholder="Es. Mario"
                   th:classappend="${#fields.hasErrors('nome')} ? is-invalid">
            <div class="invalid-feedback" th:errors="*{nome}"></div>
        </div>

        <div class="col-md-6">
            <label for="cognome" class="form-label">Cognome</label>
            <input type="text" class="form-control" th:field="*{cognome}" id="cognome"
                   placeholder="Es. Rossi"
                   th:classappend="${#fields.hasErrors('cognome')} ? is-invalid">
            <div class="invalid-feedback" th:errors="*{cognome}"></div>
        </div>

        <div class="col-md-6">
            <label for="cf" class="form-label">Codice Fiscale</label>
            <input type="text" class="form-control" th:field="*{cf}" id="cf"
                   placeholder="Es. RSSMRA85M10A562S"
                   th:classappend="${#fields.hasErrors('cf')} ? is-invalid">
            <div class="invalid-feedback" th:errors="*{cf}"></div>
        </div>

        <div class="col-md-6">
		    <label for="dataNascita" class="form-label">Data di nascita</label>
		    <input type="date" class="form-control" th:field="*{dataDiNascita}" id="dataNascita"
		           th:classappend="${#fields.hasErrors('dataDiNascita')} ? is-invalid">
		    <div class="invalid-feedback" th:errors="*{dataDiNascita}"></div>
		    <!-- Non serve un div separato per maggiorenne perché l'errore è sullo stesso campo -->
		</div>

        <!-- Campi Dipendente -->
        <div class="col-md-6">
            <label for="stipendio" class="form-label">Stipendio</label>
            <input type="number" step="0.01" class="form-control" th:field="*{stipendio}" id="stipendio"
                   placeholder="Es. 2500.00"
                   th:classappend="${#fields.hasErrors('stipendio')} ? is-invalid">
            <div class="invalid-feedback" th:errors="*{stipendio}"></div>
        </div>

        <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}" id="email"
                   placeholder="Es. mario.rossi@email.com"
                   th:classappend="${#fields.hasErrors('email')} ? is-invalid">
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>

        <div class="col-md-6">
            <label for="dataAssunzione" class="form-label">Data di assunzione</label>
            <input type="date" class="form-control" th:field="*{dataDiAssunzione}" id="dataAssunzione"
                   th:classappend="${#fields.hasErrors('dataDiAssunzione')} ? is-invalid">
            <div class="invalid-feedback" th:errors="*{dataDiAssunzione}"></div>
        </div>

        <div class="col-md-6">
            <label for="ruolo" class="form-label">Ruolo</label>
            <select class="form-select" th:field="*{tipoRuolo}" id="ruolo"
                    th:classappend="${#fields.hasErrors('tipoRuolo')} ? is-invalid" required>
                <option value="">Seleziona un ruolo</option>
                <option th:each="r : ${T(com.example.demo.entities.Ruolo).values()}"
                        th:value="${r}" th:text="${r}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{tipoRuolo}"></div>
        </div>

        <!-- Pulsanti -->
        <div class="col-12">
            <div class="d-flex flex-wrap gap-2 justify-content-start">
                <button class="btn btn-secondary" type="reset">🗑️ Cancella</button>
                <button class="btn btn-success" type="submit"
                        th:if="${p.id == null or p.id == 0}">✅ Registrati</button>
                <button class="btn btn-primary" type="submit"
                        th:if="${p.id != null and p.id != 0}">💾 Applica</button>
                <a class="btn btn-danger" th:href="@{/home}">✖ Annulla</a>
            </div>
        </div>

    </form>
</div>

<script th:src="@{/js/bootstrap-js/bootstrap.bundle.min.js}"></script>
</body>
</html>
