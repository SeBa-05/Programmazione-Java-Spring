<!doctype html>
<html lang="it" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap-css/bootstrap.rtl.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Form Progetto</title>
</head>
<body>
<div class="container container-form">

    <h2 th:if="${progetto.id == null or progetto.id == 0}">➕ Nuovo Progetto</h2>
    <h2 th:if="${progetto.id != null and progetto.id != 0}">✏️ Modifica Progetto</h2>

    <div th:if="${msg != null}" class="alert alert-warning" role="alert" th:text="${msg}"></div>

    <form th:action="${progetto.id} != null ? @{'/progetti/' + ${progetto.id} + '/edit'} : @{/progetti/new}" 
          class="row g-3" th:object="${progetto}" method="post">

        <!-- Nome -->
        <div class="col-md-12">
            <label for="nome" class="form-label">Nome Progetto *</label>
            <input type="text" class="form-control" th:field="*{nome}" id="nome"
                   placeholder="Es. JavaSpring"
                   th:classappend="${#fields.hasErrors('nome')} ? is-invalid">
            <div class="invalid-feedback" th:errors="*{nome}"></div>
        </div>

        <!-- Data Inizio -->
        <div class="col-md-6">
            <label for="dataInizio" class="form-label">Data Inizio *</label>
            <input type="date" class="form-control" th:field="*{dataInizio}" id="dataInizio"
                   th:classappend="${#fields.hasErrors('dataInizio')} ? is-invalid">
            <div class="invalid-feedback" th:errors="*{dataInizio}"></div>
        </div>

        <!-- Data Fine -->
        <div class="col-md-6">
            <label for="dataFine" class="form-label">Data Fine</label>
            <input type="date" class="form-control" th:field="*{dataFine}" id="dataFine"
                   th:classappend="${#fields.hasErrors('dataFine')} ? is-invalid">
            <div class="invalid-feedback" th:errors="*{dataFine}"></div>
        </div>

        <!-- Budget -->
        <div class="col-md-6">
            <label for="budget" class="form-label">Budget</label>
            <input type="number" step="0.01" min="0" class="form-control" th:field="*{budget}" id="budget"
                   placeholder="Es. 1000.00"
                   th:classappend="${#fields.hasErrors('budget')} ? is-invalid">
            <div class="invalid-feedback" th:errors="*{budget}"></div>
        </div>

        <!-- Stato -->
        <div class="col-md-6">
            <label for="stato" class="form-label">Stato</label>
            <select class="form-select" th:field="*{stato}" id="stato"
                    th:classappend="${#fields.hasErrors('stato')} ? is-invalid">
                <option value="ATTIVO">ATTIVO</option>
                <option value="COMPLETATO">COMPLETATO</option>
                <option value="SOSPESO">SOSPESO</option>
            </select>
            <div class="invalid-feedback" th:errors="*{stato}"></div>
        </div>

        <!-- Descrizione -->
        <div class="col-12">
            <label for="descrizione" class="form-label">Descrizione</label>
            <textarea class="form-control" th:field="*{descrizione}" id="descrizione" rows="3"
                      placeholder="Inserisci una descrizione del progetto..."
                      th:classappend="${#fields.hasErrors('descrizione')} ? is-invalid"></textarea>
            <div class="invalid-feedback" th:errors="*{descrizione}"></div>
        </div>

        <!-- Pulsanti -->
        <div class="col-12">
            <button class="btn btn-secondary" type="reset">🗑️ Cancella</button>
            <button class="btn btn-success" type="submit"
                    th:if="${progetto.id == null or progetto.id == 0}">➕ Crea Progetto</button>
            <button class="btn btn-primary" type="submit"
                    th:if="${progetto.id != null and progetto.id != 0}">💾 Aggiorna Progetto</button>
            <a class="btn btn-danger" th:href="@{/progetti}">✖ Annulla</a>
        </div>

    </form>
</div>
<script th:src="@{/js/bootstrap-js/bootstrap.bundle.min.js}"></script>
</body>
</html>
